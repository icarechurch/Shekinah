name: Shekinah CI

on:
  push:
  pull_request:

jobs:
  windows-ucrt64:
    name: Windows UCRT64 build and tests
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install MSYS2 dependencies
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-catch
            mingw-w64-ucrt-x86_64-nlohmann-json
      - name: Configure
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          cmake --preset windows-ucrt64-debug \
            -DCMAKE_CXX_COMPILER="$(cygpath -m "$MSYS2_LOCATION/ucrt64/bin/g++.exe")" \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$MSYS2_LOCATION/ucrt64")"
      - name: Build
        run: cmake --build --preset windows-ucrt64-debug --parallel 2
      - name: Test
        run: ctest --test-dir build/windows-ucrt64-debug --output-on-failure
      - name: Run N4000 benchmark
        run: ./build/windows-ucrt64-debug/shekinah_n4000_bench.exe --json shekinah-n4000.json
      - name: Upload N4000 benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: shekinah-n4000-benchmark
          path: shekinah-n4000.json
      - name: Configure release
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          cmake --preset windows-ucrt64-release \
            -DCMAKE_CXX_COMPILER="$(cygpath -m "$MSYS2_LOCATION/ucrt64/bin/g++.exe")" \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$MSYS2_LOCATION/ucrt64")"
      - name: Build release
        run: cmake --build --preset windows-ucrt64-release --parallel 2
      - name: Test release
        run: ctest --test-dir build/windows-ucrt64-release --output-on-failure
